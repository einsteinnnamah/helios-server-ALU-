# TESTING ONLY. No worker, broker, disk, or paid service.
services:
  - type: web
    name: alu-helios-demo
    runtime: docker
    plan: free
    region: frankfurt
    autoDeployTrigger: "off"
    healthCheckPath: /
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: settings_render_demo
      - key: HELIOS_DEMO_MODE
        value: "1"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "1"
      - key: DEBUG
        value: "0"
      - key: SSL
        value: "1"
      - key: AUTH_ENABLED_SYSTEMS
        value: alu
      - key: ALU_STUDENT_DOMAIN
        value: alustudent.com
      - key: SECRET_KEY
        generateValue: true
      - key: EMAIL_OPTOUT_SECRET
        generateValue: true
      - key: ALU_BRIDGE_APP_ORIGIN
        sync: false
      - key: ALU_BRIDGE_SECRET
        sync: false
      - key: ALU_BRIDGE_CLIENT_ID
        value: alu-helios-demo
      - key: ALU_BRIDGE_ELECTIONS
        value: ""
      - key: DATABASE_URL
        fromDatabase:
          name: alu-helios-demo-db
          property: connectionString
databases:
  - name: alu-helios-demo-db
    plan: free
    region: frankfurt
    databaseName: helios
    user: helios
