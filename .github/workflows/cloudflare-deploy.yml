name: Cloudflare backend deployment

# A committed, explicitly selected Git revision is deployed only on demand.
# Adding this file or pushing a branch never switches the live backend.
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Verify the live placement without rebuilding or restarting the backend'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-backend-production
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ !inputs.verify_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: helios
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefix cloudflare
      - name: Check Worker types
        working-directory: cloudflare
        run: |
          npm run types
          npm run check
      - name: Test lifecycle recovery and placement verification
        working-directory: cloudflare
        run: node --test check-placement.test.mjs lifecycle.test.mjs
      - name: Build the backend and check runtime integrity
        run: |
          docker build --tag alu-cloudflare-validated .
          docker run --rm --entrypoint python alu-cloudflare-validated -c "import django,pathlib; assert django.get_version(); assert pathlib.Path('/app/helios/models.py').stat().st_size > 1000; assert not pathlib.Path('/app/.local-testing').exists(); assert not pathlib.Path('/app/cloudflare').exists()"
          python scripts/check-container-startup.py alu-cloudflare-validated '${{ job.services.postgres.id }}'

  deploy:
    if: ${{ always() && (needs.validate.result == 'success' || inputs.verify_only) }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci --prefix cloudflare
      - name: Deploy the selected committed revision
        if: ${{ !inputs.verify_only }}
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c66816623540ac2342c071dee2a16704
        run: |
          set -o pipefail
          voting_deploy_log="$RUNNER_TEMP/alu-backend-deploy.log"
          npx wrangler deploy --keep-vars | tee "$voting_deploy_log"
          node deployed-image.mjs "$voting_deploy_log" >> "$GITHUB_ENV"
      - name: Verify backend placement near the Ohio database
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c66816623540ac2342c071dee2a16704
        run: node check-placement.mjs
